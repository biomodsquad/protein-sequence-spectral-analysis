[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "Protspect"
version = "0.1.0a1"
description = "Spectral transform features for protein and peptide sequences"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Biomolecular Systems Modeling and Design Group"}]
maintainers = [{name = "Biomolecular Systems Modeling and Design Group"}]
keywords = ["protein", "peptide", "Fourier", "spectral analysis", "bioinformatics"]
dependencies = ["numpy>=1.23", "scipy>=1.9", "pandas>=1.5"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Repository = "https://github.com/biomodsquad/protein-sequence-spectral-analysis"
Issues = "https://github.com/biomodsquad/protein-sequence-spectral-analysis/issues"
Documentation = "https://github.com/biomodsquad/protein-sequence-spectral-analysis#readme"
Changelog = "https://github.com/biomodsquad/protein-sequence-spectral-analysis/blob/main/CHANGELOG.md"
Support = "https://github.com/biomodsquad/protein-sequence-spectral-analysis/issues"

[project.optional-dependencies]
docs = ["sphinx>=7,<9", "furo>=2024.8", "myst-parser>=3,<5",
        "matplotlib>=3.6", "scikit-learn>=1.4", "PyWavelets>=1.4",
        "nbformat>=5.9", "nbclient>=0.8", "ipykernel>=6.25",
        "tomli>=2; python_version < '3.11'"]
wavelets = ["PyWavelets>=1.4"]
ml = ["scikit-learn>=1.4"]
validation = ["scikit-learn>=1.4", "threadpoolctl>=3", "matplotlib>=3.6"]
dev = ["pytest>=7", "build>=1", "twine>=5", "ruff>=0.9"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["protspect", "protspect.examples", "FFTpro"]
namespaces = false

[tool.setuptools.package-data]
"protspect.examples" = ["*.ipynb"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
