name: Package checks
on:
  push:
    branches: [main]
    paths: ['protspect/**', 'FFTpro/**', 'tests/**', 'examples/**', 'ci/**', 'pyproject.toml', 'MANIFEST.in', 'README.md', 'LICENSE', '.github/workflows/ci.yml']
  pull_request:
    paths: ['protspect/**', 'FFTpro/**', 'tests/**', 'examples/**', 'ci/**', 'pyproject.toml', 'MANIFEST.in', 'README.md', 'LICENSE', '.github/workflows/ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev,validation]'
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
  installed:
    needs: build
    name: ${{ matrix.os }} / py${{ matrix.python }} / ${{ matrix.dependencies }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        dependencies: [latest]
        include:
          - os: ubuntu-latest
            python: '3.10'
            dependencies: minimum
          - os: macos-latest
            python: '3.10'
            dependencies: minimum
          - os: windows-latest
            python: '3.10'
            dependencies: minimum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Check fresh wheel and sdist installs with latest compatible dependencies
        if: matrix.dependencies == 'latest'
        run: python ci/check_installed.py --output-dir compatibility-results
      - name: Check exact declared minimum runtime and optional dependencies
        if: matrix.dependencies == 'minimum'
        run: python ci/check_installed.py --constraints ci/constraints/minimum.txt --output-dir compatibility-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.dependencies }}
          path: compatibility-results/
