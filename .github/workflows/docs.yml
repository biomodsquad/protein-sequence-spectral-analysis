name: Documentation
on:
  push:
    branches: [main]
    paths: ['docs/**', 'protspect/**', 'examples/**', 'research/*.ipynb', 'research/embedding_atlas/*.ipynb', 'ci/check_tutorials.py', 'pyproject.toml', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'protspect/**', 'examples/**', 'research/*.ipynb', 'research/embedding_atlas/*.ipynb', 'ci/check_tutorials.py', 'pyproject.toml', '.github/workflows/docs.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this documentation build to GitHub Pages
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      MPLBACKEND: Agg
      PROTSPECT_DOCS_REF: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[docs]'
      - run: python -m docs.generate_tutorial_figures
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - run: python -m ci.check_docs_links docs/_build/html
      - run: python -m sphinx -W --keep-going -b doctest docs docs/_build/doctest
      - run: python -m ci.check_tutorials --output docs/_build/notebooks
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-preview
          path: docs/_build/
      - name: Prepare Pages deployment
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html
  deploy:
    concurrency:
      group: github-pages
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
